server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — hash routing (#fraud-journey) is client-side, but this keeps
    # any direct path request serving the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache built assets aggressively (they are content-hashed by Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
